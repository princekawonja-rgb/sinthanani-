<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinthanani - Kusinthana Katundu</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f6f3ec;color:#1a1a1a}
header{background:#0f7a4a;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:720px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
label{font-weight:700;font-size:13px;display:block;margin-top:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:4px 0 0;font-size:15px}
.btn{background:#0f7a4a;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:700;width:100%;font-size:16px;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.item img{width:100%;height:170px;object-fit:cover;background:#eee}
.item div{padding:10px}.pill{display:inline-block;background:#e8f5ee;color:#0f7a4a;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:700}
.wa{display:block;text-align:center;background:#25D366;color:#fff;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
.filters{display:flex;gap:8px}.filters>*{flex:1}
</style>
</head>
<body>
<header><h1>🔄 Sinthanani</h1><p>Kusinthana Katundu - Barter App Malawi</p><p id="status" style="font-size:12px">● Connecting to Firebase...</p></header>
<div class="wrap">
<div class="card">
<label>What do you have? / Muli ndi chani?</label><input id="title" placeholder="e.g. 50kg Maize - Chimanga">
<label>What do you want? / Mukufuna chani?</label><input id="want" placeholder="e.g. Bicycle - Njinga">
<label>Location / Malo</label><select id="district"><option>Blantyre</option><option>Lilongwe</option><option>Mzuzu</option><option>Zomba</option><option>Kasungu</option><option>Salima</option><option>Mangochi</option><option>Karonga</option><option>Thyolo</option><option>Other</option></select>
<label>Category</label><select id="cat"><option>Food / Chakudya</option><option>Electronics</option><option>Animals / Ziweto</option><option>Clothes / Zovala</option><option>Transport</option><option>Other</option></select>
<label>WhatsApp Number</label><input id="phone" placeholder="e.g. 0999123456">
<label>Your Name</label><input id="name" placeholder="Your Name">
<label>Photo Link (optional)</label><input id="photo" placeholder="Paste photo link, or leave empty">
<button class="btn" onclick="addItem()">Publish Item - Sindikizani</button><p id="msg"></p>
</div>

<div class="card filters"><input id="search" placeholder="🔍 Search..."><select id="filterDistrict"><option value="">All Districts</option><option>Blantyre</option><option>Lilongwe</option><option>Mzuzu</option><option>Zomba</option><option>Kasungu</option><option>Salima</option><option>Mangochi</option><option>Karonga</option><option>Thyolo</option><option>Other</option></select></div>
<div id="list" class="grid"></div>
</div>
<footer>Sinthanani © 2026 • Made for Malawi 🇲🇼</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// --- PASTE YOUR CONFIG HERE - copy from Acode lines 51-56 ---
const firebaseConfig = {
  apiKey: "AIzaSyBXBjAN3wd_99knkaIN1SgBgR0G - PASTE FULL FROM ACODE LINE 51",
  authDomain: "sinthanani-997de.firebaseapp.com",
  projectId: "sinthanani-997de",
  storageBucket: "sinthanani-997de.firebasestorage.app",
  messagingSenderId: "504088914794",
  appId: "1:504088914794:web:0a7cbfe7c145d8 - PASTE FULL FROM ACODE LINE 56"
};
// ------------------------------------------------------------

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const itemsCol = collection(db, "items");
document.getElementById('status').textContent = "● Live - Connected to Firebase";

let allItems = [];
window.addItem = async () => {
  const title=document.getElementById('title').value.trim();
  const want=document.getElementById('want').value.trim();
  const district=document.getElementById('district').value;
  const cat=document.getElementById('cat').value;
  const phone=document.getElementById('phone').value.trim();
  const name=document.getElementById('name').value.trim();
  const photo=document.getElementById('photo').value.trim();
  if(!title||!want||!phone||!name){alert("Please fill What you have, What you want, Name, WhatsApp");return;}
  document.getElementById('msg').textContent="Publishing...";
  try{
    await addDoc(itemsCol,{title,want,district,cat,phone,name,photo,createdAt:serverTimestamp()});
    document.getElementById('msg').textContent="✅ Zikomo! Your item is published!";
    ['title','want','phone','name','photo'].forEach(id=>document.getElementById(id).value="");
  }catch(e){ document.getElementById('msg').textContent="❌ Error: "+e.message; }
};
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const d=document.getElementById('filterDistrict').value;
  const list=document.getElementById('list');
  const filtered=allItems.filter(i=> (!d||i.district===d) && (i.title+" "+i.want+" "+i.district+" "+(i.cat||"")).toLowerCase().includes(q));
  if(!filtered.length){list.innerHTML="<p>No items yet. Be the first to post!</p>";return;}
  list.innerHTML=filtered.map(i=>{
    let wa=i.phone.replace(/\D/g,""); if(wa.startsWith("0")) wa="265"+wa.slice(1); if(!wa.startsWith("265")) wa="265"+wa;
    return `<div class="item">${i.photo?`<img src="${i.photo}">`:`<div style="height:170px;background:#e8f5ee;display:flex;align-items:center;justify-content:center;font-size:40px">📦</div>`}<div><span class="pill">${i.district} • ${i.cat||""}</span><h3 style="margin:8px 0 4px">${i.title}</h3><p style="margin:0"><b>Wants:</b> ${i.want}</p><small>By ${i.name}</small><a class="wa" target="_blank" href="https://wa.me/${wa}?text=${encodeURIComponent("Hi "+i.name+", I saw your "+i.title+" on Sinthanani. I want to barter!")}">💬 WhatsApp ${i.name}</a></div></div>`
  }).join("");
}
document.getElementById('search').oninput=render;
document.getElementById('filterDistrict').onchange=render;
onSnapshot(query(itemsCol, orderBy("createdAt","desc")), snap=>{
  allItems=snap.docs.map(d=>({id:d.id,...d.data()})); render();
}, err=>{ document.getElementById('status').textContent="❌ Firebase Error: "+err.message; });
</script>
</body>
</html>
