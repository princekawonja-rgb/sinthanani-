<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sinthanani - Kusinthana Katundu | Malawi Barter App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7ed;color:#222}
header{background:#16a34a;color:#fff;padding:18px 14px;text-align:center}
header h1{margin:0;font-size:28px}header p{margin:6px 0 0;opacity:.95}
.top{padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,textarea{padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;width:100%}
.search{max-width:500px;flex:1}.cats{display:flex;gap:8px;overflow:auto;padding:10px 12px}
.cats button{white-space:nowrap;border:1px solid #16a34a;background:#fff;color:#16a34a;padding:8px 14px;border-radius:20px;cursor:pointer}
.cats button.on{background:#16a34a;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img{width:100%;height:170px;object-fit:cover;background:#e5e7eb}
.card .b{padding:12px}.price{color:#16a34a;font-weight:700}
.tag{background:#fef3c7;padding:3px 8px;border-radius:20px;font-size:12px}
.btn{display:block;text-align:center;background:#16a34a;color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:10px;border:0;width:100%;cursor:pointer}
.btn2{background:#111827}.form{background:#fff;margin:12px;padding:16px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.form h2{margin-top:0}label{font-weight:700;font-size:14px;display:block;margin:12px 0 5px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
</style>
</head>
<body>
<header><h1>🔄 Sinthanani</h1><p>Kusinthana Katundu • Barter in Malawi • No Money Needed</p></header>
<div class="top"><input class="search" id="search" placeholder="🔍 Search... e.g. maize, phone, bicycle" oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="form">
<h2>➕ Add Your Item - Ikani Katundu Wanu</h2>
<label>What do you have? / Muli ndi chani?</label><input id="title" placeholder="e.g. 50kg Maize">
<label>What do you want? / Mukufuna chani?</label><input id="want" placeholder="e.g. Bicycle or MK 80,000">
<label>Location / Malo</label><select id="loc"><option>Lilongwe</option><option>Blantyre</option><option>Mzuzu</option><option>Zomba</option><option>Kasungu</option><option>Salima</option><option>Mangochi</option><option>Other</option></select>
<label>Category</label><select id="cat"><option>Food / Chakudya</option><option>Phones</option><option>Clothes / Zovala</option><option>Farming</option><option>Home</option><option>Other</option></select>
<label>WhatsApp Number</label><input id="phone" placeholder="e.g. 0999123456">
<label>Photo Link (optional)</label><input id="img" placeholder="Paste image link or leave empty">
<button class="btn" onclick="addItem()">Publish Item • Sindikiza</button>
</div>
<footer>Sinthanani © 2026 • Made for Malawi 🇲🇼 • Kusinthana, osati kugula</footer>
<script>
let items=[
{title:"50kg Maize - Chimanga",want:"Bicycle or MK 85,000",loc:"Lilongwe",cat:"Food / Chakudya",phone:"0999123456",img:"https://images.unsplash.com/photo-1551754655-cd27e38d2076?w=600"},
{title:"iPhone 11 - Good Condition",want:"Samsung + Cash",loc:"Blantyre",cat:"Phones",phone:"0888123456",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=600"},
{title:"2 Chickens - Nkhuku",want:"20kg Rice",loc:"Mzuzu",cat:"Food / Chakudya",phone:"0997654321",img:"https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=600"},
{title:"Bicycle - Njinga",want:"Goat / Mbuzi",loc:"Zomba",cat:"Farming",phone:"0991112222",img:"https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=600"},
{title:"Sofa Set - 3 Seater",want:"Fridge",loc:"Lilongwe",cat:"Home",phone:"0889000111",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600"},
{title:"School Uniforms",want:"Maize Flour",loc:"Kasungu",cat:"Clothes / Zovala",phone:"0993334444",img:"https://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=600"}
];
let saved=JSON.parse(localStorage.getItem('sintha')||'[]'); items=saved.concat(items);
let cur='All';
let cats=['All','Food / Chakudya','Phones','Clothes / Zovala','Farming','Home','Other'];
document.getElementById('cats').innerHTML=cats.map(c=>`<button class="${c===cur?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
function setCat(c){cur=c;document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('on',b.textContent===c));render();}
function render(){
 let q=(document.getElementById('search').value||'').toLowerCase();
 let list=items.filter(i=>(cur==='All'||i.cat===cur)&&(i.title.toLowerCase().includes(q)||i.loc.toLowerCase().includes(q)));
 document.getElementById('grid').innerHTML=list.map(i=>`<div class="card"><img src="${i.img||'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600'}"><div class="b"><span class="tag">${i.cat}</span> <span class="tag">📍 ${i.loc}</span><h3 style="margin:8px 0 4px">${i.title}</h3><p style="margin:0;color:#555">Want: <b>${i.want}</b></p><a class="btn" href="https://wa.me/265${i.phone.replace(/^0/,'')}" target="_blank">💬 Chat on WhatsApp</a></div></div>`).join('')||'<p style="padding:20px">No items found. Try another search.</p>';
}
function addItem(){
 let t=document.getElementById('title').value, w=document.getElementById('want').value, p=document.getElementById('phone').value;
 if(!t||!w||!p){alert('Please fill Title, Want and WhatsApp');return;}
 let n={title:t,want:w,loc:document.getElementById('loc').value,cat:document.getElementById('cat').value,phone:p,img:document.getElementById('img').value};
 items.unshift(n); localStorage.setItem('sintha',JSON.stringify([n].concat(JSON.parse(localStorage.getItem('sintha')||'[]'))));
 alert('Zikomo! Your item is published!'); render(); window.scrollTo(0,0);
}
render();
</script>
</body>
                              </html>
